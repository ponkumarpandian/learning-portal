<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="A syringe lying on its side: a plunger on the left, a barrel half filled with water, and a sealed nozzle on the right (redrawn from Fig. 3.9)">
  <!-- plunger handle + rod -->
  <rect x="18" y="62" width="14" height="76" rx="5" fill="#94a3b8" stroke="#475569" stroke-width="3"/>
  <rect x="32" y="92" width="70" height="16" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="3"/>
  <!-- barrel -->
  <rect x="100" y="64" width="240" height="72" rx="10" fill="#f1f5f9" fill-opacity="0.6" stroke="#475569" stroke-width="4"/>
  <!-- plunger head inside barrel -->
  <rect x="102" y="68" width="16" height="64" rx="3" fill="#64748b"/>
  <!-- water -->
  <rect x="200" y="68" width="136" height="64" rx="6" fill="#38bdf8" fill-opacity="0.75"/>
  <!-- scale marks -->
  <g stroke="#475569" stroke-width="2">
    <line x1="140" y1="64" x2="140" y2="78"/><line x1="170" y1="64" x2="170" y2="78"/>
    <line x1="200" y1="64" x2="200" y2="78"/><line x1="230" y1="64" x2="230" y2="78"/>
    <line x1="260" y1="64" x2="260" y2="78"/><line x1="290" y1="64" x2="290" y2="78"/>
    <line x1="320" y1="64" x2="320" y2="78"/>
  </g>
  <!-- nozzle + seal -->
  <rect x="340" y="91" width="28" height="18" rx="3" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
  <rect x="366" y="86" width="16" height="28" rx="5" fill="#f59e0b" stroke="#92400e" stroke-width="3"/>
</svg>
